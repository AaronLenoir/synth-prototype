[rack]

[[instruments]]
type="TheOneOhOne"
name="synth1"

# [source instrument, source port, target instrument, target port]
[connections]
endpoints = [
    # MAIN AUDIO OUT
    ["synth1", "OUT_LEFT", "__AUDIO_OUT", "IN_LEFT" ],
    ["synth1", "OUT_RIGHT", "__AUDIO_OUT", "IN_RIGHT" ],
]

[sequencer]
tempo=120
meter={ numerator = 3, denominator = 4 }

[[sequencer.clips]]
start={ bar = 1, beat = 1, offset = 0.0 }
end={ bar = 9, beat = 2, offset = 0.0 } 
target = "synth1"

[[sequencer.clips.notes]]
note = 32
velocity = 0.5
start = { bar = 1, beat = 1, offset = 0.0 }
end = { bar = 1, beat = 2, offset = 0.0 }

[[sequencer.clips.notes]]
note = 32
velocity = 0.5
start = { bar = 2, beat = 1, offset = 0.0 }
end = { bar = 3, beat = 1, offset = 0.0 }

[[sequencer.clips.notes]]
note = 32
velocity = 0.5
start = { bar = 4, beat = 1, offset = 0.0 }
end = { bar = 4, beat = 1, offset = 0.125 }