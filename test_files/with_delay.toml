[rack]

[[instruments]]
type="TheOneOhOne"
name="synth1"

[[instruments]]
type="Delay"
name="delay1"
[instruments.parameters]
delay=1
decay=0.90

# [source instrument, source port, target instrument, target port]
[connections]
endpoints = [
    ["synth1", "OUT_LEFT", "delay1", "IN_LEFT" ],
    ["synth1", "OUT_RIGHT", "delay1", "IN_RIGHT" ],

    # MAIN AUDIO OUT
    ["delay1", "OUT_LEFT", "__AUDIO_OUT", "IN_LEFT" ],
    ["delay1", "OUT_RIGHT", "__AUDIO_OUT", "IN_RIGHT" ],
]

[sequencer]
tempo=200
meter={ numerator = 3, denominator = 4 }

[[sequencer.clips]]
start={ bar = 1, beat = 1, offset = 0.0 }
end={ bar = 100, beat = 2, offset = 0.0 } 
target = "synth1"

[[sequencer.clips.notes]]
note = 48
velocity = 0.5
start = { bar = 1, beat = 1, offset = 0.0 }
end = { bar = 1, beat = 2, offset = 0.5 }

